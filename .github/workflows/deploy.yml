name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master, copilot/develop-game-browsing-installation]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  generate-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate PNG icons from SVG
        run: |
          npm install --save-dev sharp
          node -e "
          const sharp = require('sharp');
          const fs = require('fs');
          const svg = fs.readFileSync('icon.svg');
          Promise.all([
            sharp(svg).resize(192,192).png().toFile('icon-192.png'),
            sharp(svg).resize(512,512).png().toFile('icon-512.png'),
          ]).then(() => console.log('Icons generated'));
          "
      - uses: actions/upload-artifact@v4
        with:
          name: icons
          path: |
            icon-192.png
            icon-512.png

  deploy:
    needs: generate-icons
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: icons
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
